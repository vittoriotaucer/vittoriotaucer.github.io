<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#14120b">
    <title>{{ page.title | escape }} — {{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>

  <body>
    <main class="site-shell">
      <a class="back-link" href="{{ '/' | relative_url }}">← Vittorio Taucer</a>

      <article>
        <header class="entry-header">
          <h1>{{ page.title }}</h1>
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d/%m/%Y" }}</time>
        </header>

        <div class="prose">
          {{ content }}
        </div>
      </article>
    </main>
  </body>
</html>
